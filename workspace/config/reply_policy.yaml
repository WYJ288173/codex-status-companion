auto_reply:
  enabled: true
  allowed_scenarios:
  - low_risk_qa
  - monitor_recovered
  - history_duplicate
  require_evidence_strength: A
  require_evidence_in_reply: true
  block_risk_markers:
  - has_order_id
  - has_modify_id
  - has_refund_id
  - has_trace_id
  - has_amount
  - has_audit_loss_risk
  - needs_write
  - needs_external_attribution
  - batch_impact
  - tool_failed
  - evidence_missing
  - unknown_scope
